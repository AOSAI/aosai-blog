<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{margin:0;background:#fbfaf7;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}svg{display:block;width:100%;max-width:960px;margin:auto}.title{font:600 27px "Noto Sans SC","PingFang SC",sans-serif;fill:#25334a}.panel{fill:#fff;stroke:#dce3e6;stroke-width:2}.section{font:600 20px "Noto Sans SC","PingFang SC",sans-serif;fill:#25334a}.cell{font:600 19px "Noto Sans SC","PingFang SC",sans-serif;fill:#26334b}.muted{font:500 15px "Noto Sans SC","PingFang SC",sans-serif;fill:#53627a}.score{font:500 18px "Noto Sans SC","PingFang SC",sans-serif;fill:#3d4c63}.result{font:600 25px "Noto Sans SC","PingFang SC",sans-serif;fill:#25334a}.legend{font:500 15px "Noto Sans SC","PingFang SC",sans-serif;fill:#53627a}</style></head><body><svg viewBox="0 0 960 430" role="img" aria-labelledby="miou-title miou-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="miou-title">mIoU：每类分别算像素 IoU，再求平均</title>
  <desc id="miou-desc">同一组两行三列的标注图与预测图。背景 IoU 为二除以四，道路为一除以三，车为一，三类平均约零点六一一。</desc>
  <rect width="960" height="430" fill="#fbfaf7" />
  <text x="480" y="47" text-anchor="middle" class="title">mIoU：先算每个类别的 IoU，再求平均</text>
  <rect x="45" y="88" width="260" height="270" rx="18" class="panel" />
  <rect x="350" y="88" width="260" height="270" rx="18" class="panel" />
  <rect x="655" y="88" width="260" height="270" rx="18" class="panel" />
  <text x="175" y="127" text-anchor="middle" class="section">标注类别图</text>
  <text x="480" y="127" text-anchor="middle" class="section">预测类别图</text>
  <text x="785" y="127" text-anchor="middle" class="section">逐类 IoU</text>
  <rect x="81" y="152" width="57" height="57" rx="8" fill="#dce2e7" stroke="#fff" stroke-width="2" /><text x="109.5" y="189" text-anchor="middle" class="cell">0</text><rect x="146" y="152" width="57" height="57" rx="8" fill="#dce2e7" stroke="#fff" stroke-width="2" /><text x="174.5" y="189" text-anchor="middle" class="cell">0</text><rect x="211" y="152" width="57" height="57" rx="8" fill="#69a9d6" stroke="#fff" stroke-width="2" /><text x="239.5" y="189" text-anchor="middle" class="cell">1</text><rect x="81" y="217" width="57" height="57" rx="8" fill="#dce2e7" stroke="#fff" stroke-width="2" /><text x="109.5" y="254" text-anchor="middle" class="cell">0</text><rect x="146" y="217" width="57" height="57" rx="8" fill="#ed8070" stroke="#fff" stroke-width="2" /><text x="174.5" y="254" text-anchor="middle" class="cell">2</text><rect x="211" y="217" width="57" height="57" rx="8" fill="#69a9d6" stroke="#fff" stroke-width="2" /><text x="239.5" y="254" text-anchor="middle" class="cell">1</text>
  <rect x="386" y="152" width="57" height="57" rx="8" fill="#dce2e7" stroke="#fff" stroke-width="2" /><text x="414.5" y="189" text-anchor="middle" class="cell">0</text><rect x="451" y="152" width="57" height="57" rx="8" fill="#69a9d6" stroke="#fff" stroke-width="2" /><text x="479.5" y="189" text-anchor="middle" class="cell">1</text><rect x="516" y="152" width="57" height="57" rx="8" fill="#69a9d6" stroke="#fff" stroke-width="2" /><text x="544.5" y="189" text-anchor="middle" class="cell">1</text><rect x="386" y="217" width="57" height="57" rx="8" fill="#dce2e7" stroke="#fff" stroke-width="2" /><text x="414.5" y="254" text-anchor="middle" class="cell">0</text><rect x="451" y="217" width="57" height="57" rx="8" fill="#ed8070" stroke="#fff" stroke-width="2" /><text x="479.5" y="254" text-anchor="middle" class="cell">2</text><rect x="516" y="217" width="57" height="57" rx="8" fill="#dce2e7" stroke="#fff" stroke-width="2" /><text x="544.5" y="254" text-anchor="middle" class="cell">0</text>
  <text x="175" y="325" text-anchor="middle" class="muted">每格代表一个像素</text>
  <text x="480" y="325" text-anchor="middle" class="muted">与左图逐格比较</text>
  <text x="785" y="168" text-anchor="middle" class="score">背景：2 / 4 = 0.500</text>
  <text x="785" y="208" text-anchor="middle" class="score">道路：1 / 3 ≈ 0.333</text>
  <text x="785" y="248" text-anchor="middle" class="score">车：1 / 1 = 1.000</text>
  <line x1="695" x2="875" y1="273" y2="273" stroke="#d9e0e4" stroke-width="2" />
  <text x="785" y="316" text-anchor="middle" class="result">mIoU ≈ 0.611</text>
  <rect x="259" y="384" width="16" height="16" rx="3" fill="#dce2e7" />
  <text x="283" y="398" class="legend">0 背景</text>
  <rect x="410" y="384" width="16" height="16" rx="3" fill="#69a9d6" />
  <text x="434" y="398" class="legend">1 道路</text>
  <rect x="561" y="384" width="16" height="16" rx="3" fill="#ed8070" />
  <text x="585" y="398" class="legend">2 车</text>
</svg></body></html>
