<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{margin:0;background:#fbfaf7;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}svg{display:block;width:100%;max-width:960px;margin:auto}.title{font:600 27px "Noto Sans SC","PingFang SC",sans-serif;fill:#25334a}.panel{fill:#fff;stroke:#dce3e6;stroke-width:2}.section{font:600 20px "Noto Sans SC","PingFang SC",sans-serif;fill:#25334a}.body{font:500 19px "Noto Sans SC","PingFang SC",sans-serif;fill:#3d4c63}.legend{font:500 14px "Noto Sans SC","PingFang SC",sans-serif;fill:#53627a}.result{font:600 21px "Noto Sans SC","PingFang SC",sans-serif;fill:#25334a}</style></head><body><svg viewBox="0 0 960 410" role="img" aria-labelledby="dice-title dice-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dice-title">Dice：用重叠像素的两倍除以两个区域的像素数之和</title>
  <desc id="dice-desc">六个像素的示意网格：标注和预测各有三个目标像素，其中两个重叠。Dice 等于二乘二除以三加三，约为零点六六七。</desc>
  <rect width="960" height="410" fill="#fbfaf7" />
  <text x="480" y="45" text-anchor="middle" class="title">Dice：交集计两次，除以两块区域的大小之和</text>
  <rect x="60" y="82" width="430" height="284" rx="18" class="panel" />
  <rect x="510" y="82" width="390" height="284" rx="18" class="panel" />
  <text x="275" y="120" text-anchor="middle" class="section">2×3 像素掩码</text>
  <rect x="131" y="140" width="74" height="74" rx="9" fill="#edf0f2" stroke="#ffffff" stroke-width="3" /><rect x="213" y="140" width="74" height="74" rx="9" fill="#8074b5" stroke="#ffffff" stroke-width="3" /><rect x="295" y="140" width="74" height="74" rx="9" fill="#31a99f" stroke="#ffffff" stroke-width="3" /><rect x="131" y="222" width="74" height="74" rx="9" fill="#edf0f2" stroke="#ffffff" stroke-width="3" /><rect x="213" y="222" width="74" height="74" rx="9" fill="#8074b5" stroke="#ffffff" stroke-width="3" /><rect x="295" y="222" width="74" height="74" rx="9" fill="#ed746a" stroke="#ffffff" stroke-width="3" />
  <rect x="101" y="323" width="15" height="15" rx="3" fill="#31a99f" />
  <text x="124" y="337" class="legend">仅标注 1</text>
  <rect x="221" y="323" width="15" height="15" rx="3" fill="#8074b5" />
  <text x="244" y="337" class="legend">重叠 2</text>
  <rect x="335" y="323" width="15" height="15" rx="3" fill="#ed746a" />
  <text x="358" y="337" class="legend">仅预测 1</text>
  <text x="705" y="120" text-anchor="middle" class="section">代入公式</text>
  <text x="705" y="166" text-anchor="middle" class="body">标注区域：3 个像素</text>
  <text x="705" y="203" text-anchor="middle" class="body">预测区域：3 个像素</text>
  <text x="705" y="240" text-anchor="middle" class="body">重叠区域：2 个像素</text>
  <line x1="577" x2="833" y1="261" y2="261" stroke="#d9e0e4" stroke-width="2" />
  <text x="705" y="308" text-anchor="middle" class="result">Dice = 2×2 / (3+3) ≈ 0.667</text>
</svg></body></html>
