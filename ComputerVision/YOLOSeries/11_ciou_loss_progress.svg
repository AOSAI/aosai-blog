<svg viewBox="0 0 1200 432" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">预测框四条边共同变化，CIoU 损失沿一条可能的路径降低</title>
  <desc id="desc">四个示意状态共享相同的标注框。预测框的四条边一起变化，损失依次为 0.68、0.5125、0.2781、0；这不是固定调整顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#7d8da1" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="1200" height="432" fill="#fbfaf7"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="600" y="43" text-anchor="middle" font-size="27" font-weight="600" fill="#25334a">四条边一起变化，预测框逐渐贴近标注框</text>
    <rect x="420" y="65" width="18" height="14" fill="#38aaa0" fill-opacity=".10" stroke="#228f86" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="447" y="78" font-size="16" fill="#53627a">标注框（固定）</text>
    <rect x="620" y="65" width="18" height="14" fill="#ed736b" fill-opacity=".24" stroke="#df6158" stroke-width="2"/>
    <text x="647" y="78" font-size="16" fill="#53627a">预测框（变化）</text>

    <text x="165" y="113" text-anchor="middle" font-size="19" font-weight="600" fill="#25334a">A · 初始预测</text>
    <text x="455" y="113" text-anchor="middle" font-size="19" font-weight="600" fill="#25334a">B · 边界共同变化</text>
    <text x="745" y="113" text-anchor="middle" font-size="19" font-weight="600" fill="#25334a">C · 继续贴近</text>
    <text x="1035" y="113" text-anchor="middle" font-size="19" font-weight="600" fill="#25334a">完全重合</text>

    <line x1="256" y1="228" x2="361" y2="228" stroke="#7d8da1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="546" y1="228" x2="651" y2="228" stroke="#7d8da1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="836" y1="228" x2="941" y2="228" stroke="#7d8da1" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="85" y="136" width="160" height="160" fill="#38aaa0" fill-opacity=".10" stroke="#228f86" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="85" y="136" width="96" height="96" fill="#ed736b" fill-opacity=".24" stroke="#df6158" stroke-width="3"/>
    <rect x="375" y="136" width="160" height="160" fill="#38aaa0" fill-opacity=".10" stroke="#228f86" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="391" y="152" width="112" height="112" fill="#ed736b" fill-opacity=".24" stroke="#df6158" stroke-width="3"/>
    <rect x="665" y="136" width="160" height="160" fill="#38aaa0" fill-opacity=".10" stroke="#228f86" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="673" y="144" width="136" height="136" fill="#ed736b" fill-opacity=".24" stroke="#df6158" stroke-width="3"/>
    <rect x="955" y="136" width="160" height="160" fill="#ed736b" fill-opacity=".24" stroke="#df6158" stroke-width="5"/>
    <rect x="955" y="136" width="160" height="160" fill="none" stroke="#228f86" stroke-width="3" stroke-dasharray="7 5"/>

    <text x="165" y="329" text-anchor="middle" font-size="17" fill="#53627a">边界 (0, 0, 60, 60)</text>
    <text x="455" y="329" text-anchor="middle" font-size="17" fill="#53627a">边界 (10, 10, 80, 80)</text>
    <text x="745" y="329" text-anchor="middle" font-size="17" fill="#53627a">边界 (5, 5, 90, 90)</text>
    <text x="1035" y="329" text-anchor="middle" font-size="17" fill="#53627a">边界 (0, 0, 100, 100)</text>
    <text x="165" y="362" text-anchor="middle" font-size="22" font-weight="600" fill="#ba4f48">Loss = 0.6800</text>
    <text x="455" y="362" text-anchor="middle" font-size="22" font-weight="600" fill="#ba4f48">Loss = 0.5125</text>
    <text x="745" y="362" text-anchor="middle" font-size="22" font-weight="600" fill="#ba4f48">Loss = 0.2781</text>
    <text x="1035" y="362" text-anchor="middle" font-size="22" font-weight="600" fill="#228f86">Loss = 0</text>
    <text x="600" y="410" text-anchor="middle" font-size="15" fill="#53627a">仅为一条可能的改进路径；没有固定调整顺序，也不保证每次训练更新都下降</text>
  </g>
</svg>
