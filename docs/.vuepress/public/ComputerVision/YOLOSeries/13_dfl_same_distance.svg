<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="dfl-same-title dfl-same-desc">
<title id="dfl-same-title">16 档分数如何得到同一个距离</title>
<desc id="dfl-same-desc">两组十六档权重都解码为二点五格；靠近目标档位的一组 DFLoss 约零点八三，远处档位较高的一组约三点零一，理论最小值为自然对数二。</desc>
<rect width="1200" height="540" fill="#fbfaf7"/>
<g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="600" y="43" text-anchor="middle" font-size="27" font-weight="650" fill="#25334a">同一个左边距离，可由不同的 16 档权重算出</text>
<text x="600" y="72" text-anchor="middle" font-size="17" font-weight="400" fill="#53627a">检测头输出 16 个原始分数；柱高是它们经过 Softmax 后的权重</text>
<line x1="355" y1="113" x2="355" y2="429" stroke="#df6158" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="291" y="84" width="128" height="25" rx="4" fill="#fbfaf7"/>
<text x="355" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#ba4f48">标注距离 2.5</text>
<text x="42" y="142" text-anchor="start" font-size="20" font-weight="650" fill="#25334a">A · 邻近档位高</text>
<text x="42" y="172" text-anchor="start" font-size="15" font-weight="400" fill="#53627a">16 档权重之和 = 1</text>
